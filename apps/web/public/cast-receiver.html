<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siti Counter - Smart Display Cast Web Receiver</title>
  <!-- Google Cast Application Framework (CAF) Receiver SDK -->
  <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" src="/?receiver=true"></iframe>
  <script>
    try {
      const context = cast.framework.CastReceiverContext.getInstance();
      const SITI_CAST_NAMESPACE = 'urn:x-cast:com.siticounter.cooking';

      context.addCustomMessageListener(SITI_CAST_NAMESPACE, function(customEvent) {
        var frame = document.getElementById('app-frame');
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({
            type: 'CAST_MESSAGE',
            namespace: SITI_CAST_NAMESPACE,
            data: customEvent.data,
          }, '*');
        }
      });

      context.start();
    } catch (e) {
      console.warn('CAF receiver context note:', e);
    }
  </script>
</body>
</html>
